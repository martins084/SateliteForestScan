# Stage 5b: s2forest blind validation on LVM land (AOI candidate 3, Riga region, 5 x 5 km; replication of AOI 1).
# Frozen v0.2-kalsnava config (configs/test_kalsnava_2025.yaml at the tag); changed ONLY:
# run_name, aoi, time.monitor_year (2024, baseline = 3 previous seasons as in v0.2);
# `reference` (Kalsnava winter cuts) removed.
run_name: lvm5b_riga_2024
aoi: ../data/aoi_lvm5b_riga.geojson
output_dir: ../output
cache_dir: ../cache

time:
  monitor_year: 2024
  baseline_years: 3
  season_start: "05-01"
  season_end: "09-30"

data:
  sources:
    - {name: earthsearch, collection: sentinel-2-c1-l2a}
    - {name: planetary, collection: sentinel-2-l2a}
  crs: EPSG:3059
  resolution: 10
  max_scene_cloud_cover: 95
  min_valid_fraction: 0.6
  workers: 4

masking:
  invalid_scl: [0, 1, 3, 8, 9, 10, 11]
  cloud_buffer_m: 20

forest_mask:
  source: hrl_dlt_2018
  classes: [2]

indices: [ndvi, ndre, ndmi, crswir]

anomaly:
  z_threshold: 2.5
  persistence: 2
  doy_window: 30
  min_baseline_obs: 5
  primary_index: crswir
  min_confirming: 1
  min_area_ha: 0.1
  normalization:
    enabled: true
    buffer_m: 5000
