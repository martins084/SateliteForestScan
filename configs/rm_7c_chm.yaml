# MežaSargs risk model, stage 7c (user 2026-11-12; PLANS 2.26): CHMv2 imagery dates per cell, leakage diagnostics,
# B_chm_clean. Same inputs as 7b (configs/rm_7b_modeli.yaml); the 7b sample is read, not rebuilt. Report: docs/RM_7c_CHM_NOPLUDE.md.
run_name: rm7c_chm
output_dir: ../output
cache_dir: ../cache

efda:
  main:
    version: v3.0.0
    doi: 10.5281/zenodo.21722408
    archive: Lithuania.zip
    dir: ../cache/efda/v3.0/Lithuania.zip
    first_year: 1985
    agent: disturbance_agent_lithuania_v30.tif
    agent_aggregated: disturbance_agent_aggregated_lithuania_v30.tif
    forest: forestlanduse_mask_lithuania_v30.tif

boundaries:
  path: ../cache/boundaries/NUTS_RG_01M_2024_3035_LEVL_3.geojson   # GISCO NUTS 2024, (c) EuroGeographics
  country: LV
  min_cover: 0.95
  border_buffer_m: 1000
  control_lonlat: [25.85, 56.69]

lvm:
  damage: ../cache/lvm_open/LVM_BOJAJUMI_wayback20250503.zip
  damage_snapshot: 2025-04-27
  land_units: ../cache/lvm_open/LVM_ZEMES_VIENIBAS_wayback20250421.zip
  stem_pest: 620
  years: [2013, 2024]

features:
  block_3059: [490000, 275000, 510000, 295000]
  margin_m: 5000
  years: [2013, 2024]
  k_exclude: 5
  climate_dir: ../output/rm4_klimats
  hrl_dlt: ../cache/rm/hrl_dlt2018_LV_100m.tif
  chm: false                             # user 2026-11-05: no CHMv2 for all of Latvia
  chm_from_year: 2020
  source: lvm620_wayback20250503
  picea_dir: ../cache/rm/picea            # Picea abies p, Latvia windows (picea-fetch, user 2026-11-05)

models:
  blocks_dir: C:/Users/varna/server_backup/s2-forest-screening/output/rm6b_latvija/blocks   # READ ONLY copy
  chm_dir: C:/Users/varna/projects/s2-forest-screening/output/rm7b_chm/chm     # CHMv2 30 m aggregates (chm-latvia, copied from server 2026-11-12; not in git)
  test_years: [2019, 2024]
  neg_ratio: 10
  neg_floor: 200
  seed: 20261105
  n_boot: 999
  n_folds: 5
  new_focus_m: 500
  perm_repeats: 5
  chm_dates_dir: C:/Users/varna/projects/s2-forest-screening/output/rm7c_chm/dates   # chm-dates (not in git)
  sample: C:/Users/varna/projects/s2-forest-screening/output/rm7b_modeli/tables/sample_7b.nc   # 7b sample (read only)
