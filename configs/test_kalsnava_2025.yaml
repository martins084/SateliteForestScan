# Same AOI as test_kalsnava.yaml, monitoring 2025 with baseline 2022-2024.
# Exercises the 2022 gap in sentinel-2-c1-l2a (filled from Planetary Computer).
run_name: test_kalsnava_2025
aoi: ../data/test_aoi_kalsnava.geojson
output_dir: ../output
cache_dir: ../cache

time:
  monitor_year: 2025
  baseline_years: 3
  season_start: "05-01"
  season_end: "09-30"

data:
  sources:
    - {name: earthsearch, collection: sentinel-2-c1-l2a}
    - {name: planetary, collection: sentinel-2-l2a}
  crs: EPSG:3059
  resolution: 10
  max_scene_cloud_cover: 95
  min_valid_fraction: 0.6
  workers: 4

masking:
  invalid_scl: [0, 1, 3, 8, 9, 10, 11]
  cloud_buffer_m: 20

forest_mask:
  source: hrl_dlt_2018
  classes: [2]

indices: [ndvi, ndre, ndmi, crswir]

anomaly:
  z_threshold: 2.5
  persistence: 2
  doy_window: 30
  min_baseline_obs: 5
  primary_index: crswir
  min_confirming: 1
  min_area_ha: 0.1
  normalization:
    enabled: true
    buffer_m: 5000
